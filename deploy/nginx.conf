# sso.1task.cn —— sso-bff 对外入口（nginx 反代模板）
# 与 Casdoor / new-api 前置同构；正式入口统一二级域名，不用裸 IP:端口。

server {
    listen 443 ssl http2;
    server_name sso.1task.cn;

    # TLS：与 1task.cn 其他服务共用证书策略（acme 签发）
    ssl_certificate     /etc/nginx/ssl/1task.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/1task.cn/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OIDC 回调 302 跳 Casdoor/new-api 域名，必须透传 Location
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name sso.1task.cn;
    return 301 https://$host$request_uri;
}
