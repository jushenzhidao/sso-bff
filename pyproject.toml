[project]
name = "sso-bff"
version = "1.0.0"
description = "多应用统一认证与计费打通 — BFF 身份服务（Casdoor OIDC × new-api 计费）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    "cryptography>=43",
    "pydantic-settings>=2.4",
    "authlib>=1.3",
    "python-jose[cryptography]>=3.3",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sso_bff*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
